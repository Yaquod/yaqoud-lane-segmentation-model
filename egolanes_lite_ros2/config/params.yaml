egolanes_lite_node:
  ros__parameters:
    model_path: EgoLanesLite_best.onnx
    image_topic: /sensing/camera/traffic_light/image_raw
    mask_topic: /perception/lane_detection/mask
    input_h: 400
    input_w: 800
    threshold: 0.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    use_cuda: true

egolanes_ipm_node:
  ros__parameters:
    mask_topic: /perception/lane_detection/mask
    costmap_topic: /perception/lane_detection/costmap
    vis_topic: /perception/lane_detection/ipm_vis
    # Source points in the camera image (default 800x400) forming a trapezoid
    src_points: [
      [300.0, 250.0],  # Top-left
      [500.0, 250.0],  # Top-right
      [750.0, 400.0],  # Bottom-right
      [50.0, 400.0]    # Bottom-left
    ]
    # Destination points in the BEV image forming a rectangle
    dst_points: [
      [100.0, 0.0],    # Top-left
      [300.0, 0.0],    # Top-right
      [300.0, 400.0],  # Bottom-right
      [100.0, 400.0]   # Bottom-left
    ]
    grid_resolution: 0.05  # meters per pixel
    grid_width: 400        # pixels
    grid_height: 400       # pixels
    publish_vis: true
