egolanes_lite_node:
  ros__parameters:
    model_path: "EgoLanesLite_best.onnx"
    image_topic: "/sensing/camera/traffic_light/image_raw"
    mask_topic: "/perception/lane_detection/mask"
    mask_vis_topic: "/perception/lane_detection/mask_vis"
    input_h: 400
    input_w: 800
    threshold: 0.5
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    use_cuda: true

egolanes_ipm_node:
  ros__parameters:
    mask_topic: "/perception/lane_detection/mask"
    costmap_topic: "/perception/lane_detection/costmap"
    vis_topic: "/perception/lane_detection/ipm_vis"

    # src_points: trapezoid drawn on the 800×400 mask image.
    #
    # Your previous values (480,450 … 1200,720) were sized for a 1280×720
    # image but the mask is 800×400 — everything was outside the frame.
    #
    # These defaults approximate a forward-facing dashcam on a standard road.
    # Use the calibration tool to tune them on a real frame from your camera.
    #
    # Order: Top-Left, Top-Right, Bottom-Right, Bottom-Left
    # Reminder: in a 800×400 image, valid x: 0–800, valid y: 0–400.
    src_points: [300.0, 200.0, 500.0, 200.0, 750.0, 380.0, 50.0, 380.0]

    # dst_points: rectangle in the 400×400 BEV output grid.
    # Keep this unchanged unless you want to change the BEV crop area.
    # Order: Top-Left, Top-Right, Bottom-Right, Bottom-Left
    dst_points: [100.0, 0.0, 300.0, 0.0, 300.0, 400.0, 100.0, 400.0]

    grid_resolution: 0.05   # metres per pixel in the BEV grid
    grid_width: 400
    grid_height: 400
    publish_vis: true

egolanes_vectorizer_node:
  ros__parameters:
    mask_topic: "/perception/lane_detection/mask"
    left_topic:  "/perception/lane_detection/left_cluster"
    right_topic: "/perception/lane_detection/right_cluster"
    marker_topic: "/perception/lane_detection/lane_markers"
    publish_markers: true

    # ── Camera intrinsics ──────────────────────────────────────────────────────
    # These MUST come from your camera calibration file (camera_info topic or
    # the .yaml produced by camera_calibration). Look for the K matrix:
    #
    #   K: [fx, 0, cx,
    #        0, fy, cy,
    #        0,  0,  1]
    #
    # You can do it with the commands below:
    # If using Autoware, look here:
    ### cat /path/to/your/camera_info.yaml
    # Or echo the live topic:
    ### ros2 topic echo /sensing/camera/traffic_light/camera_info --once
    #
    # For an 800×400 image with a typical dashcam, fx/fy ≈ 500–800.
    # Set camera_cx / camera_cy to -1 to auto-use image_width/2, image_height/2.
    #
    camera_fx: 600.0   # <-- replace with your calibrated value
    camera_fy: 600.0   # <-- replace with your calibrated value
    camera_cx: -1.0    # -1 = use image_width / 2  (400.0 for 800-wide image)
    camera_cy: -1.0    # -1 = use image_height / 2 (200.0 for 400-tall image)

    # ── Camera extrinsics ──────────────────────────────────────────────────────
    # camera_height_m: vertical distance from ground to camera optical centre.
    # Measure with a tape measure from the road surface to the camera lens.
    camera_height_m: 1.2      # metres — adjust to your vehicle

    # camera_pitch_deg: how many degrees the camera tilts downward toward road.
    # 0 = perfectly horizontal. Positive = nose-down (typical dashcam ~5–15 deg).
    # To measure: use a spirit level app on your camera mount.
    camera_pitch_deg: 0.0     # degrees — adjust to your camera mount

    # ── Sampling ───────────────────────────────────────────────────────────────
    row_step: 4               # sample centroid every N rows (lower = denser points)
    min_pixels_per_row: 5     # ignore rows with fewer lane pixels (noise filter)
    max_range_m: 30.0         # discard ground-projected points farther than this

    base_link_frame: "base_link"
